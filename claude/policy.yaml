permissions:
  filesystem:
    read: true
    write: true
    write_patterns:
      - "src/**"
      - "tests/**"
      - "test/**"
      - "docs/**"
      - "scripts/**"
      - "config/**"
      - "*.md"
      - "*.json"
      - "*.yaml"
      - "*.yml"
      - "*.toml"
    exclude_patterns:
      - ".env"
      - ".env.*"
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/vendor/**"
      - "**/__pycache__/**"
      - "**/dist/**"
      - "**/build/**"
      - "*.key"
      - "*.pem"
      - "*.crt"
      - "**/secrets/**"

  exec:
    allowed_commands:
      # Version control
      - git

      # Build tools
      - make
      - cmake
      - gradle
      - mvn
      - bazel
      - ninja

      # Shell
      - bash
      - sh
      - zsh
      - fish

      # Go
      - go
      - gofmt
      - golint
      - delve

      # Node.js/JavaScript
      - node
      - npm
      - yarn
      - pnpm
      - npx
      - bun
      - deno
      - tsx
      - ts-node

      # Python
      - python
      - python3
      - pip
      - pip3
      - poetry
      - pipenv
      - uv
      - ruff
      - black
      - mypy
      - pylint
      - flake8

      # Rust
      - cargo
      - rustc
      - rustfmt
      - clippy

      # Ruby
      - ruby
      - gem
      - bundle
      - rake
      - rails

      # Java/JVM
      - java
      - javac
      - scala
      - sbt
      - kotlin

      # C/C++
      - gcc
      - g++
      - clang
      - clang++
      - llvm

      # Docker/Container
      - docker
      - docker-compose
      - podman
      - kubectl
      - helm
      - minikube
      - kind

      # Database CLI
      - psql
      - mysql
      - sqlite3
      - redis-cli
      - mongo
      - mongosh

      # Cloud CLI
      - aws
      - gcloud
      - az
      - terraform
      - terragrunt
      - pulumi

      # File operations
      - ls
      - cat
      - head
      - tail
      - less
      - more
      - wc
      - sort
      - uniq
      - diff
      - cp
      - mv
      - mkdir
      - touch
      - chmod
      - chown

      # Text processing
      - grep
      - sed
      - awk
      - cut
      - tr
      - paste
      - column
      - jq
      - yq
      - xmllint

      # Network utilities
      - curl
      - wget
      - nc
      - netcat
      - telnet
      - ping
      - traceroute
      - dig
      - nslookup
      - host
      - ss
      - netstat
      - lsof

      # System info
      - ps
      - top
      - htop
      - df
      - du
      - free
      - uptime
      - uname
      - whoami
      - id
      - env
      - printenv
      - date
      - cal

      # Archive/compression
      - tar
      - gzip
      - gunzip
      - bzip2
      - bunzip2
      - zip
      - unzip
      - 7z

      # Search and file management
      - find
      - locate
      - which
      - whereis
      - file
      - stat
      - tree
      - fd
      - rg
      - ripgrep
      - ag
      - fzf

      # Testing
      - pytest
      - jest
      - mocha
      - jasmine
      - karma
      - vitest
      - ava
      - tape
      - go test
      - cargo test

      # Linting and formatting
      - eslint
      - prettier
      - stylelint
      - shellcheck
      - yamllint
      - jsonlint
      - hadolint

      # Package managers
      - apt
      - apt-get
      - yum
      - dnf
      - pacman
      - brew
      - port
      - snap
      - flatpak

      # Editors (CLI)
      - vim
      - nvim
      - nano
      - emacs
      - vi

      # Monitoring/debugging
      - strace
      - ltrace
      - gdb
      - lldb
      - valgrind
      - perf

      # Misc development tools
      - tmux
      - screen
      - watch
      - xargs
      - parallel
      - entr
      - fswatch
      - inotifywait

    blocked_commands:
      - rm -rf /
      - dd
      - mkfs
      - fdisk

    timeout: 300000  # 5 minutes

  network:
    outbound: true
    allowed_hosts:
      # Local development
      - localhost
      - 127.0.0.1
      - "0.0.0.0"

      # Package registries
      - "*.npmjs.org"
      - "registry.npmjs.org"
      - "*.pypi.org"
      - "pypi.org"
      - "*.python.org"
      - "pkg.go.dev"
      - "proxy.golang.org"
      - "crates.io"

      # Code hosting
      - "*.github.com"
      - "github.com"
      - "raw.githubusercontent.com"
      - "*.gitlab.com"
      - "gitlab.com"
      - "bitbucket.org"

      # Cloud providers (add as needed)
      - "*.amazonaws.com"
      - "*.cloudfront.net"

      # CDNs
      - "*.cloudflare.com"
      - "cdnjs.cloudflare.com"
      - "unpkg.com"
      - "cdn.jsdelivr.net"

      # Documentation
      - "*.readthedocs.io"
      - "docs.rs"

    blocked_hosts:
      - "*.internal"
      - "169.254.169.254"  # AWS metadata service
      - "metadata.google.internal"  # GCP metadata service

    allowed_ports:
      - 80
      - 443
      - 8000
      - 8080
      - 3000
      - 5000
      - 9000

rate_limits:
  commands_per_minute: 60
  network_requests_per_minute: 100
  file_operations_per_minute: 200
