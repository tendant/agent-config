version: 1

mode: non_interactive

defaults:
  assume_yes: true
  fail_fast: true
  verbosity: minimal

behavior:
  ask_for_confirmation: false
  ask_clarifying_questions: only_if_ambiguous
  auto_commit: false
  create_backups: true

logging:
  redact_secrets: true
  level: info
  output_format: structured
  log_file: logs/claude-agent.log
  rotation:
    max_size: 10485760  # 10MB
    max_files: 5

safety:
  allow_destructive: false
  prod_guard: true
  require_confirmation_for:
    - git_push
    - rm_rf
    - database_operations

timeouts:
  command_execution: 300000  # 5 minutes in milliseconds
  file_operations: 30000     # 30 seconds
  network_requests: 60000    # 1 minute

resources:
  max_file_size: 10485760      # 10MB
  max_output_length: 100000    # characters
  concurrent_operations: 5
  memory_limit: 536870912      # 512MB

retry:
  max_attempts: 3
  backoff_multiplier: 2
  initial_delay: 1000  # milliseconds
